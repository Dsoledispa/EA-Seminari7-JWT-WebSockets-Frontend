@if (open()) {
  <div class="overlay" (click)="cancelled.emit()">
    <div class="modal" (click)="$event.stopPropagation()">
      <h2>{{ title() }}</h2>
      <p>{{ message() }}</p>
      <div class="actions">
        <button type="button" class="secondary" (click)="cancelled.emit()">
          {{ cancelText() }}
        </button>
        <button type="button" class="danger" (click)="confirmed.emit()">
          {{ confirmText() }}
        </button>
      </div>
    </div>
  </div>
}
