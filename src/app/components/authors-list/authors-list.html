<h1>Autores</h1>

<table>
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Email</th>
      <th>Nacionalidad</th>
    </tr>
  </thead>
  <tbody>
    @for (author of authors(); track author._id) {
      <tr>
        <td>{{ author.name }}</td>
        <td>{{ author.email }}</td>
        <td>{{ author.nationality }}</td>
      </tr>
    }
  </tbody>
</table>
