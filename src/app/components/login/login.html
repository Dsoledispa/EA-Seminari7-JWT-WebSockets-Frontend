<h1>Iniciar sesión</h1>

@if (registered()) {
  <p class="notice">Cuenta creada. Ya puedes iniciar sesión.</p>
}

@if (error()) {
  <p class="alert">{{ error() }}</p>
}

<form [formGroup]="form" (ngSubmit)="login()">
  <label>
    Email
    <input type="email" formControlName="email" autocomplete="username" />
    @if (form.controls.email.touched && form.controls.email.hasError('required')) {
      <small class="field-error">El email es obligatorio</small>
    } @else if (form.controls.email.touched && form.controls.email.hasError('email')) {
      <small class="field-error">El email no tiene un formato válido</small>
    }
  </label>

  <label>
    Contraseña
    <input type="password" formControlName="password" autocomplete="current-password" />
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <small class="field-error">La contraseña es obligatoria</small>
    }
  </label>

  <div class="form-actions">
    <button type="submit" [disabled]="form.invalid || saving()">
      {{ saving() ? 'Entrando...' : 'Entrar' }}
    </button>
    <a routerLink="/register">No tengo cuenta</a>
  </div>
</form>
