<h1>{{ id() ? 'Editar libro' : 'Nuevo libro' }}</h1>

@if (error()) {
  <p class="alert">{{ error() }}</p>
}

@if (loading()) {
  <p class="muted">Cargando...</p>
} @else if (loadFailed()) {
  <a routerLink="/books">Volver a la lista de libros</a>
} @else {
  <form [formGroup]="form" (ngSubmit)="save()">
    <label>
      Título *
      <input type="text" formControlName="title" />
      @if (form.controls.title.touched && form.controls.title.invalid) {
        <small class="field-error">El título es obligatorio</small>
      }
    </label>

    <label>
      ISBN *
      <input type="text" formControlName="isbn" />
      @if (form.controls.isbn.touched && form.controls.isbn.invalid) {
        <small class="field-error">El ISBN es obligatorio</small>
      }
    </label>

    <label>
      Autores *
      <select multiple formControlName="authors">
        @for (author of authors(); track author._id) {
          <option [value]="author._id">{{ author.name }}</option>
        }
      </select>
      <small class="hint">Ctrl + clic para elegir varios</small>
      @if (form.controls.authors.touched && form.controls.authors.invalid) {
        <small class="field-error">Elige al menos un autor</small>
      }
    </label>

    <label>
      Año de publicación
      <input type="number" formControlName="publishedYear" />
      @if (form.controls.publishedYear.touched && form.controls.publishedYear.invalid) {
        <small class="field-error">Tiene que estar entre 1450 y 2100</small>
      }
    </label>

    <label>
      Páginas
      <input type="number" formControlName="pages" min="1" />
      @if (form.controls.pages.touched && form.controls.pages.invalid) {
        <small class="field-error">Tiene que tener 1 página como mínimo</small>
      }
    </label>

    <label>
      Idioma
      <select formControlName="language">
        @for (language of languages; track language) {
          <option [value]="language">{{ language | languageName }}</option>
        }
      </select>
    </label>

    <label>
      Tags
      <select multiple formControlName="tags">
        @for (tag of tags; track tag) {
          <option [value]="tag">{{ tag }}</option>
        }
      </select>
      <small class="hint">Ctrl + clic para elegir varios</small>
    </label>

    <label>
      Precio (€)
      <input type="number" formControlName="price" min="0" step="0.01" />
      @if (form.controls.price.touched && form.controls.price.invalid) {
        <small class="field-error">No puede ser negativo</small>
      }
    </label>

    <div class="form-actions">
      <button type="submit" [disabled]="form.invalid || saving()">
        {{ saving() ? 'Guardando...' : 'Guardar' }}
      </button>
      <a routerLink="/books">Cancelar</a>
    </div>
  </form>
}
