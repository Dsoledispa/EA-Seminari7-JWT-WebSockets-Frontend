<h1>{{ id() ? 'Editar autor' : 'Nuevo autor' }}</h1>

@if (error()) {
  <p class="alert">{{ error() }}</p>
}

@if (loading()) {
  <p class="muted">Cargando...</p>
} @else if (loadFailed()) {
  <a routerLink="/authors">Volver a la lista de autores</a>
} @else {
  <form [formGroup]="form" (ngSubmit)="save()">
    <label>
      Nombre *
      <input type="text" formControlName="name" />
      @if (form.controls.name.touched && form.controls.name.invalid) {
        <small class="field-error">El nombre es obligatorio</small>
      }
    </label>

    <label>
      Email *
      <input type="email" formControlName="email" />
      @if (form.controls.email.touched && form.controls.email.hasError('required')) {
        <small class="field-error">El email es obligatorio</small>
      } @else if (form.controls.email.touched && form.controls.email.hasError('email')) {
        <small class="field-error">El email no tiene un formato válido</small>
      }
    </label>

    <label>
      Fecha de nacimiento
      <input type="date" formControlName="birthDate" />
    </label>

    <label>
      Nacionalidad
      <input type="text" formControlName="nationality" />
    </label>

    <label>
      Web
      <input type="url" formControlName="website" placeholder="https://..." />
      @if (form.controls.website.touched && form.controls.website.invalid) {
        <small class="field-error">Tiene que empezar por http:// o https://</small>
      }
    </label>

    <label class="checkbox">
      <input type="checkbox" formControlName="active" />
      Activo
    </label>

    <div class="form-actions">
      <!-- Property binding: el botón se desactiva si el formulario no es válido o se está guardando -->
      <button type="submit" [disabled]="form.invalid || saving()">
        {{ saving() ? 'Guardando...' : 'Guardar' }}
      </button>
      <a routerLink="/authors">Cancelar</a>
    </div>
  </form>
}
